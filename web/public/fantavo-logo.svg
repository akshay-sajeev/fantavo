<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b82ed6" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>

    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Group with Neon Glow Filter -->
  <g filter="url(#neonFilter)" transform="translate(0, -10)">
    <!-- Outer Cyan/Blue Football Curves -->
    <path d="M 70 160 C 130 60, 270 60, 330 160 C 270 260, 130 260, 70 160 Z" 
          fill="none" stroke="url(#blueGlow)" stroke-width="5" stroke-linecap="round" />

    <!-- Inner Purple Intersecting Shell -->
    <path d="M 100 160 C 145 90, 255 90, 300 160 C 255 230, 145 230, 100 160 Z" 
          fill="none" stroke="url(#purpleGlow)" stroke-width="3" stroke-dasharray="12 6" />

    <!-- Circuit Trace Accents -->
    <!-- Left Top Trace -->
    <path d="M 110 135 L 140 120 L 170 120" fill="none" stroke="#00f2fe" stroke-width="2" />
    <circle cx="170" cy="120" r="3.5" fill="#00f2fe" />

    <!-- Right Bottom Trace -->
    <path d="M 290 185 L 260 200 L 230 200" fill="none" stroke="#b82ed6" stroke-width="2" />
    <circle cx="230" cy="200" r="3.5" fill="#b82ed6" />

    <!-- Tech Laces (Green Hexagonal / Node Pattern) -->
    <line x1="150" y1="160" x2="250" y2="160" stroke="url(#greenGlow)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Vertical Laces Nodes -->
    <polygon points="170,148 176,154 176,166 170,172 164,166 164,154" fill="url(#greenGlow)" />
    <polygon points="200,148 206,154 206,166 200,172 194,166 194,154" fill="url(#greenGlow)" />
    <polygon points="230,148 236,154 236,166 230,172 224,166 224,154" fill="url(#greenGlow)" />
  </g>
</svg>
