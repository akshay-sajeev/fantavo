# Railway deployment config for /sim (the FastAPI + APScheduler service).
# /web deploys separately to Vercel, which has its own zero-config Next.js
# detection and doesn't need a file like this.
#
# Nixpacks auto-detects Python from requirements.txt at the repo root; the
# start command is explicit because there's no root-level main.py/app.py
# for its default Python start-command detection to find -- the real entry
# point is sim/api/app.py's `app` object, run via uvicorn.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn sim.api.app:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
# APScheduler runs its interval jobs in-process (sim/api/scheduler.py) --
# more than one replica would double-run (or N-times-run) both the
# precompute and re-ingest jobs. Restart on failure, but never scale out
# horizontally without first moving that scheduler to a real queue or a
# DB-scheduled job (see scheduler.py's own module docstring).
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
