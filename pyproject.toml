[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["sim/tests", "ingest/tests"]

[tool.mypy]
strict = true
plugins = ["numpy.typing.mypy_plugin"]

# APScheduler ships no py.typed marker / stubs (see sim/api/scheduler.py).
# Everything this repo calls on it is a handful of well-documented methods
# (add_job, start, shutdown) -- not worth vendoring or writing stubs for.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# scipy ships no inline type stubs for scipy.stats (a separate scipy-stubs
# package exists but isn't installed) -- sim/api/roster_view.py calls only
# scipy.stats.gamma.ppf, not worth vendoring stubs for one function.
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 96
