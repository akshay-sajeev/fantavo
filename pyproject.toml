[project]
name = "fantavo"
version = "0.1.0"
requires-python = ">=3.12"
# Phases 0-12's dependencies (numpy, fastapi, psycopg, ...) were installed
# ad hoc with no pyproject.toml entry -- see docs/decisions.md Phase 1/3/4
# for why (no requirements.txt existed either, so each phase followed the
# same pattern rather than introduce a new dependency-management convention
# unilaterally). google-genai (Phase 13) through requests (Auth Phase B)
# below broke that pattern one phase's own new dependency at a time. The
# rest of this list -- every remaining runtime package /sim actually
# imports -- was backfilled in the deployment phase (Auth Phase C's
# follow-up): Railway's build needs a real, complete manifest to install
# from, unlike a local dev machine where ad hoc `pip install` accumulates
# invisibly over many sessions. Floors are the versions this repo is
# actually developed and tested against, not invented minimums. Dev-only
# tooling (pytest, mypy, ruff) is deliberately excluded -- the deployed
# service runs the app, it doesn't test it.
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.52.0",
    "psycopg[binary]>=3.3.0",
    "pydantic>=2.11.0",
    "numpy>=2.2.0",
    "scipy>=1.16.0",
    "apscheduler>=3.11.0",
    "google-genai>=1.0.0",
    # argon2id password hashing for auth (Phase A) -- OWASP's current
    # recommendation over bcrypt. A real dependency entry, not an ad-hoc
    # install, following the exact precedent google-genai set: this is a
    # phase's own new, load-bearing dependency, not part of the pre-Phase-13
    # ad-hoc-installed set this file's own comment above describes.
    "argon2-cffi>=23.1.0",
    # Fernet symmetric encryption for per-user ESPN credentials at rest
    # (Auth Phase B) -- see sim/api/crypto.py.
    "cryptography>=42.0.0",
    # ESPN's live fantasy API client (Auth Phase B: ingest/espn_client.py).
    # requests was already used ad hoc by scripts/fetch_fixture.py (a
    # pre-Phase-13 dev-only script); this phase is what makes it a real,
    # load-bearing production dependency, so it gets a real entry now.
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["sim/tests", "ingest/tests"]

[tool.mypy]
strict = true
plugins = ["numpy.typing.mypy_plugin"]
# Resolve module names from the repo root when checking sim/ingest/api together;
# api/ has no __init__.py (deliberate -- implicit namespace packages, matching
# pythonpath = ["."] in [tool.pytest.ini_options]) and strict mypy reports
# api/index.py as "found twice under different module names" without this.
explicit_package_bases = true

# APScheduler ships no py.typed marker / stubs (see sim/api/scheduler.py).
# Everything this repo calls on it is a handful of well-documented methods
# (add_job, start, shutdown) -- not worth vendoring or writing stubs for.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

# scipy ships no inline type stubs for scipy.stats (a separate scipy-stubs
# package exists but isn't installed) -- sim/api/roster_view.py calls only
# scipy.stats.gamma.ppf, not worth vendoring stubs for one function.
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

# requests ships no inline type stubs and the separate types-requests
# package isn't installed -- ingest/espn_client.py calls only
# requests.Session.get/.get, not worth vendoring stubs for (same reasoning
# as the apscheduler override above).
[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 96
# Pinned explicitly so adding [project.requires-python] above (needed to
# declare google-genai as a real dependency) doesn't change ruff's inferred
# target-version and silently activate a wave of new "modernize for a newer
# Python" lint findings (e.g. UP017, datetime.UTC) across every pre-existing
# file this phase didn't touch. Matches ruff's own prior unset-target-version
# fallback (see docs/decisions.md Phase 13) -- a lint-configuration choice,
# not a statement about which Python this project actually runs on (see
# requires-python above and CLAUDE.md for that).
target-version = "py310"
